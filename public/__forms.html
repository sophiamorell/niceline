<!--
  Netlify Forms definition for the diagnostic.

  Netlify's build bot can't see forms rendered by React, so it reads this
  static file at deploy time to learn the forms' names and their fields. The
  diagnostic popup (src/components/DiagnosticModal.tsx) POSTs urlencoded data,
  including form-name, to this file's URL. Keep the field names in sync with
  the component: they are the long-run contract for the v1 scoring function.
-->
<html>
  <head></head>
  <body>
    <form name="diagnostic" data-netlify="true" netlify hidden>
      <input type="hidden" name="form-name" value="diagnostic" />
      <input name="q1" type="text" />
      <input name="q2" type="text" />
      <input name="q3" type="text" />
      <input name="q4" type="text" />
      <input name="q5_contactsTotal" type="text" />
      <input name="q5_contactsEmailable" type="text" />
      <input name="q6" type="text" />
      <input name="q7" type="text" />
      <input name="q8" type="text" />
      <input name="q9" type="text" />
      <textarea name="q10"></textarea>
      <input name="email" type="email" />
    </form>

    <!-- The "Talk to Sophie" contact popup (src/components/ContactModal.tsx). -->
    <form name="contact" data-netlify="true" netlify hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="company" type="text" />
      <textarea name="message"></textarea>
    </form>

    <!-- The email alone, posted as soon as it's entered (before question 1). -->
    <form name="diagnostic-start" data-netlify="true" netlify hidden>
      <input type="hidden" name="form-name" value="diagnostic-start" />
      <input name="email" type="email" />
    </form>
    <!-- Line Check's email gate (src/components/line-check/LineCheck.tsx,
         sendToSophie): contact details, the profile and rubric as text, every
         customer as text, and the raw JSON in "data". -->
    <form name="line-check" data-netlify="true" netlify hidden>
      <input type="hidden" name="form-name" value="line-check" />
      <input name="firstName" type="text" />
      <input name="company" type="text" />
      <input name="email" type="email" />
      <input name="optIn" type="text" />
      <textarea name="profile"></textarea>
      <textarea name="rubric"></textarea>
      <textarea name="customers"></textarea>
      <textarea name="data"></textarea>
    </form>
  </body>
</html>
